<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HASKOIN · Премиум Тапалка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #020108;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* АНИМИРОВАННЫЙ ФОН */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
        }

        .bg-gradient-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.06) 0%, transparent 50%);
            animation: moveGradient1 15s infinite alternate ease-in-out;
        }

        .bg-gradient-2 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            animation: moveGradient2 18s infinite alternate ease-in-out;
        }

        @keyframes moveGradient1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 3%) scale(1.1); }
        }

        @keyframes moveGradient2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, -4%) scale(1.15); }
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 390px;
            width: 100%;
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px 12px 0;
        }

        /* КОНТЕНТ С ПРОКРУТКОЙ */
        .page-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
        }

        .page-content::-webkit-scrollbar { display: none; }

        .page { 
            display: none;
            flex: 1;
        }

        .page.active { 
            display: flex;
            flex-direction: column;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 25, 0.85);
            backdrop-filter: blur(20px);
            padding: 6px 14px 6px 6px;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .player-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(145deg, #00ffff, #0066ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #020108;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
        }

        .player-status {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #00ffaa;
            font-size: 10px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background: #00ffaa;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .rank-badge {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 12px;
            color: #020108;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }

        /* КАРТОЧКА БАЛАНСА */
        .balance-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .balance-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .balance-icon {
            font-size: 16px;
        }

        .balance-title {
            color: #00ffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
        }

        .balance-main {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
        }

        .balance-number {
            font-size: 46px;
            font-weight: 900;
            background: linear-gradient(145deg, #ffffff, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }

        .balance-currency {
            color: #ffd700;
            font-size: 15px;
            font-weight: 700;
        }

        .balance-stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 255, 0.05);
            padding: 5px 14px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        .stat-icon {
            font-size: 16px;
        }

        .stat-value {
            color: #00ffaa;
            font-weight: 700;
            font-size: 14px;
        }

        .stat-label {
            color: #8888aa;
            font-size: 11px;
        }

        .tap-stat {
            background: rgba(255, 215, 0, 0.06);
            padding: 5px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .tap-stat span {
            color: #ffd700;
            font-weight: 800;
            font-size: 16px;
        }

        /* ЭНЕРГИЯ */
        .energy-section {
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .energy-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .energy-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00ffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .energy-value {
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
        }

        .energy-bar-container {
            height: 10px;
            background: rgba(10, 10, 20, 0.8);
            border-radius: 20px;
            padding: 1.5px;
            border: 1px solid rgba(0, 255, 255, 0.15);
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00ffaa, #ffd700);
            border-radius: 20px;
            transition: width 0.2s ease;
            box-shadow: 0 0 12px #00ffff;
            width: 100%;
        }

        .energy-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }

        .regen-info {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #00ffaa;
            font-size: 11px;
        }

        .energy-tip {
            color: #8888aa;
            font-size: 10px;
        }

        /* МОНЕТА - ИДЕАЛЬНО ПО ЦЕНТРУ */
        .coin-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px 0 16px;
            position: relative;
            flex-shrink: 0;
        }

        .coin-container {
            position: relative;
            perspective: 1000px;
        }

        .coin-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.15) 0%, rgba(255, 215, 0, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            animation: auraPulse 3s infinite alternate;
            pointer-events: none;
        }

        @keyframes auraPulse {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }

        .coin-3d {
            width: 170px;
            height: 170px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            filter: drop-shadow(0 0 25px rgba(0, 255, 255, 0.25));
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            box-shadow: 
                0 0 0 4px rgba(255, 215, 0, 0.4),
                0 0 0 8px rgba(0, 255, 255, 0.15),
                0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 -8px 12px rgba(0, 0, 0, 0.3),
                inset 0 8px 14px rgba(255, 255, 255, 0.3);
            border: 3px solid #ffd700;
            pointer-events: none;
            overflow: hidden;
        }

        .coin-face::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff, inset 0 0 10px rgba(0, 255, 255, 0.4);
            opacity: 0.7;
            pointer-events: none;
        }

        .coin-shine {
            position: absolute;
            top: 6%;
            left: 12%;
            width: 35%;
            height: 18%;
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(2px);
        }

        .coin-letter {
            font-size: 64px;
            font-weight: 900;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 4px;
            pointer-events: none;
            letter-spacing: 2px;
            text-shadow: 4px 5px 0 rgba(0, 0, 0, 0.2);
        }

        .coin-tap-label {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 4px 20px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 13px;
            color: #00ffff;
            text-shadow: 0 0 12px #00ffff;
            border: 1.5px solid rgba(0, 255, 255, 0.5);
            letter-spacing: 4px;
            pointer-events: none;
        }

        /* ЭФФЕКТ +МОНЕТЫ */
        .floating-score {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 35px #ffd700, 0 0 20px #00ffff;
            pointer-events: none;
            z-index: 100;
            animation: flyUp 0.9s ease-out forwards;
        }

        .floating-score.crit {
            color: #00ffff;
            font-size: 34px;
            text-shadow: 0 0 45px #00ffff;
        }

        @keyframes flyUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.6); }
        }

        /* КНОПКИ ДЕЙСТВИЙ */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .game-btn {
            flex: 1;
            background: linear-gradient(145deg, #1a1a3e, #0d0d22);
            color: #00ffff;
            border: 1.5px solid rgba(0, 255, 255, 0.4);
            border-radius: 18px;
            padding: 14px 10px;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 6px 0 #0a0a1a, 0 0 20px rgba(0, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.06s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 0 10px #00ffff;
            touch-action: manipulation;
        }

        .game-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #0a0a1a, 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .game-btn.gold {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.4);
            text-shadow: 0 0 10px #ffd700;
        }

        .game-btn.purple {
            color: #a78bfa;
            border-color: rgba(139, 92, 246, 0.4);
            text-shadow: 0 0 10px #a78bfa;
        }

        /* СТАТУС */
        .status-toast {
            text-align: center;
            color: #00ffff;
            font-size: 13px;
            text-shadow: 0 0 15px #00ffff;
            font-weight: 600;
            min-height: 22px;
            flex-shrink: 0;
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-nav {
            background: linear-gradient(0deg, rgba(10, 10, 25, 0.98), rgba(20, 20, 45, 0.9));
            backdrop-filter: blur(30px);
            padding: 12px 10px;
            border-top: 1.5px solid rgba(0, 255, 255, 0.25);
            display: flex;
            gap: 6px;
            z-index: 50;
            border-radius: 20px 20px 0 0;
            margin-top: 4px;
        }

        .nav-btn {
            flex: 1;
            padding: 8px 2px;
            border: none;
            background: transparent;
            color: #7777aa;
            font-weight: 700;
            font-size: 11px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
        }

        .nav-btn.active {
            background: linear-gradient(145deg, rgba(0, 255, 255, 0.12), rgba(0, 136, 255, 0.08));
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.2);
        }

        .nav-icon {
            font-size: 22px;
        }

        /* КАРТОЧКИ ДЛЯ ОСТАЛЬНЫХ СТРАНИЦ */
        .section-title {
            color: #00ffff;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
            text-align: center;
            text-shadow: 0 0 20px #00ffff;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .skin-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            border-radius: 18px;
            padding: 14px 8px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            text-align: center;
        }

        .skin-preview {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            border-radius: 50%;
        }

        .skin-name {
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .skin-btn {
            background: #1a1a3e;
            color: #00ffff;
            border: 1px solid #00ffff40;
            border-radius: 14px;
            padding: 8px;
            font-size: 11px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .upgrade-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            border-radius: 20px;
            padding: 18px 10px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            text-align: center;
        }

        .upgrade-icon {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .upgrade-btn {
            background: #1a1a3e;
            color: #00ffff;
            border: 1px solid #00ffff40;
            border-radius: 16px;
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }

        .ton-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            border-radius: 26px;
            padding: 22px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .cyber-input {
            width: 100%;
            background: #0a0a1a;
            border: 1.5px solid #00ffff30;
            border-radius: 18px;
            padding: 16px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .support-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            border-radius: 30px;
            padding: 32px 22px;
            text-align: center;
        }

        .support-username {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(145deg, #00ffff, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="bg-gradient-1"></div>
        <div class="bg-gradient-2"></div>
    </div>
    <div class="cyber-grid"></div>

    <div class="app">
        <div class="page-content">
            <!-- МАЙНИНГ -->
            <div class="page active" id="page-mine">
                <div class="top-panel">
                    <div class="player-card">
                        <div class="player-avatar" id="avatar">H</div>
                        <div class="player-info">
                            <span class="player-name" id="userName">Майнер</span>
                            <div class="player-status">
                                <span class="status-dot"></span>
                                <span>Онлайн</span>
                            </div>
                        </div>
                    </div>
                    <div class="rank-badge" id="rankDisplay">НОВИЧОК</div>
                </div>

                <div class="balance-card">
                    <div class="balance-header">
                        <span class="balance-icon">💎</span>
                        <span class="balance-title">HASKOIN</span>
                        <span class="balance-icon">💎</span>
                    </div>
                    <div class="balance-main">
                        <span class="balance-number" id="balanceDisplay">3.90</span>
                        <span class="balance-currency">HASK</span>
                    </div>
                    <div class="balance-stats">
                        <div class="stat-item">
                            <span class="stat-icon">⚡</span>
                            <span class="stat-value" id="passiveIncome">+0.00</span>
                            <span class="stat-label">/сек</span>
                        </div>
                        <div class="tap-stat">
                            <span id="tapValue">+0.05</span> за тап
                        </div>
                    </div>
                </div>

                <div class="energy-section">
                    <div class="energy-top">
                        <div class="energy-label">
                            <span>🔋</span>
                            <span>ЭНЕРГИЯ</span>
                        </div>
                        <div class="energy-value" id="energyText">445/500</div>
                    </div>
                    <div class="energy-bar-container">
                        <div class="energy-fill" id="energyFill" style="width: 89%;"></div>
                    </div>
                    <div class="energy-footer">
                        <div class="regen-info">
                            <span>🔄</span>
                            <span id="regenInfo">+1.0 / 5 сек</span>
                        </div>
                        <div class="energy-tip">⚡ -1 за тап</div>
                    </div>
                </div>

                <div class="coin-wrapper">
                    <div class="coin-container">
                        <div class="coin-aura"></div>
                        <div class="coin-3d" id="coin3D">
                            <div class="coin-face" id="coinFace" style="background: radial-gradient(circle at 30% 35%, #ffe680, #d4a017, #8b6914); border-color: #ffd700;">
                                <div class="coin-shine"></div>
                                <div class="coin-letter" id="coinLetter" style="background: linear-gradient(145deg, #fff8dc, #ffd700); -webkit-background-clip: text; background-clip: text; color: transparent;">H</div>
                                <div class="coin-tap-label">TAP</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="game-btn purple" id="regenBtn"><span>⚡</span>20 HASK</button>
                    <button class="game-btn gold" id="bonusBtn"><span>🎁</span>БОНУС</button>
                </div>

                <div class="status-toast" id="mineStatus">💎 ТАПАЙ ПО МОНЕТЕ</div>
            </div>

            <!-- СКИНЫ -->
            <div class="page" id="page-skins">
                <div class="section-title">🎨 СКИНЫ</div>
                <div class="skin-grid" id="skinGrid"></div>
                <div class="status-toast" id="skinStatus"></div>
            </div>

            <!-- ПРОКАЧКА -->
            <div class="page" id="page-boost">
                <div class="section-title">🚀 ПРОКАЧКА</div>
                <div class="upgrade-grid" id="upgradeGrid"></div>
                <div class="status-toast" id="boostStatus"></div>
            </div>

            <!-- ВЫВОД -->
            <div class="page" id="page-wallet">
                <div class="section-title">💎 ВЫВОД TON</div>
                <div class="ton-card">
                    <div style="text-align:center;margin-bottom:20px;">
                        <span style="color:#ffd700;font-size:24px;font-weight:800;">3000 HASK = 0.01 TON</span>
                    </div>
                    <input class="cyber-input" id="tonAddress" placeholder="Адрес TON (EQ... / UQ...)">
                    <input class="cyber-input" id="withdrawAmount" placeholder="Сумма в HASK">
                    <div style="color:#ffd700;margin-bottom:16px;">💰 Вы получите: <span id="tonReceive">0</span> TON</div>
                    <button class="game-btn" id="withdrawBtn" style="width:100%;">💎 ОТПРАВИТЬ</button>
                    <div id="historyContainer" style="margin-top:20px;"></div>
                </div>
            </div>

            <!-- ПОДДЕРЖКА -->
            <div class="page" id="page-support">
                <div class="support-card">
                    <div style="font-size:60px;">🆘</div>
                    <h2 style="color:#00ffff;margin:12px 0;">ПОДДЕРЖКА</h2>
                    <div class="support-username">@KU1003</div>
                    <button class="game-btn" id="openSupportBtn" style="width:100%;">💬 НАПИСАТЬ</button>
                </div>
            </div>
        </div>

        <!-- НИЖНЯЯ ПАНЕЛЬ -->
        <div class="bottom-nav">
            <button class="nav-btn active" data-page="mine"><span class="nav-icon">⛏️</span><span>Майнинг</span></button>
            <button class="nav-btn" data-page="skins"><span class="nav-icon">🎨</span><span>Скины</span></button>
            <button class="nav-btn" data-page="boost"><span class="nav-icon">🚀</span><span>Прокачка</span></button>
            <button class="nav-btn" data-page="wallet"><span class="nav-icon">💎</span><span>Вывод</span></button>
            <button class="nav-btn" data-page="support"><span class="nav-icon">🆘</span><span>Поддержка</span></button>
        </div>
    </div>

    <script>
        (function(){
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            const SKINS = [
                { id: 'default', name: 'Классик', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #ffe680, #d4a017, #8b6914)', border: '#ffd700', glow: '#ffd700', price: 0, owned: true },
                { id: 'neon', name: 'Неон', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #00ffff, #0088ff, #0044aa)', border: '#00ffff', glow: '#00ffff', price: 50 },
                { id: 'gold', name: 'Золотой', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #fff8dc, #ffd700, #b8860b)', border: '#ffd700', glow: '#ffaa00', price: 200 },
                { id: 'ruby', name: 'Рубин', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #ff6666, #cc0000, #660000)', border: '#ff4444', glow: '#ff0000', price: 250 },
                { id: 'rainbow', name: 'Радужный', letter: 'H', bg: 'linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet)', border: '#ffffff', glow: '#ff00ff', price: 500 }
            ];

            let balance = 3.90, maxEnergy = 500, currentEnergy = 445, tapMult = 1, regenMult = 1, autoActive = false;
            let ownedSkins = ['default'], equippedSkin = 'default';
            const userId = tg.initDataUnsafe?.user?.id || 'demo';
            const STORAGE_KEY = `haskoin_fixed_${userId}`;

            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('userName').textContent = user.first_name || 'Майнер';
                document.getElementById('avatar').textContent = user.first_name?.charAt(0) || 'H';
            }

            function fmt(n) { return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

            function saveData() {
                tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify({ balance, maxEnergy, currentEnergy, tapMult, regenMult, autoActive, ownedSkins, equippedSkin }));
            }

            function loadData() {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
                    if (!err && val) {
                        try {
                            const d = JSON.parse(val);
                            balance = d.balance || 3.90;
                            maxEnergy = d.maxEnergy || 500;
                            currentEnergy = d.currentEnergy ?? 445;
                            tapMult = d.tapMult || 1;
                            regenMult = d.regenMult || 1;
                            autoActive = d.autoActive || false;
                            ownedSkins = d.ownedSkins || ['default'];
                            equippedSkin = d.equippedSkin || 'default';
                        } catch(e) {}
                    }
                    refreshUI();
                    renderSkins();
                    applySkin(equippedSkin);
                });
            }

            function refreshUI() {
                document.getElementById('balanceDisplay').textContent = fmt(balance);
                const pct = (currentEnergy / maxEnergy) * 100;
                document.getElementById('energyFill').style.width = Math.max(0, pct) + '%';
                document.getElementById('energyText').textContent = `${Math.floor(currentEnergy)}/${maxEnergy}`;
                document.getElementById('tapValue').textContent = `+${(0.05 * tapMult).toFixed(2)}`;
                document.getElementById('regenInfo').textContent = `+${(1 * regenMult).toFixed(1)} / 5 сек`;
                document.getElementById('passiveIncome').textContent = `+${(autoActive ? 0.05 * tapMult : 0).toFixed(2)}`;
                const rank = balance < 1000 ? 'НОВИЧОК' : balance < 10000 ? 'МАЙНЕР' : 'ПРОФИ';
                document.getElementById('rankDisplay').textContent = rank;
            }

            function applySkin(skinId) {
                const skin = SKINS.find(s => s.id === skinId) || SKINS[0];
                equippedSkin = skinId;
                const face = document.getElementById('coinFace');
                const letter = document.getElementById('coinLetter');
                face.style.background = skin.bg;
                face.style.borderColor = skin.border;
                letter.style.background = `linear-gradient(145deg, #fff8dc, ${skin.glow})`;
                letter.style.webkitBackgroundClip = 'text';
                letter.style.backgroundClip = 'text';
                letter.style.color = 'transparent';
                letter.textContent = skin.letter;
                saveData();
            }

            function renderSkins() {
                const grid = document.getElementById('skinGrid');
                grid.innerHTML = SKINS.map(skin => `
                    <div class="skin-card">
                        <div class="skin-preview" style="background: ${skin.bg}; border: 2px solid ${skin.border}; display: flex; align-items: center; justify-content: center;">
                            <span style="font-size: 32px; font-weight: 900; background: linear-gradient(145deg, #fff, ${skin.glow}); -webkit-background-clip: text; background-clip: text; color: transparent;">${skin.letter}</span>
                        </div>
                        <div class="skin-name">${skin.name}</div>
                        <button class="skin-btn" data-skin-id="${skin.id}">
                            ${equippedSkin === skin.id ? '✅ Надет' : (ownedSkins.includes(skin.id) ? '👕 Надеть' : `${skin.price} HASK`)}
                        </button>
                    </div>
                `).join('');

                document.querySelectorAll('.skin-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const skinId = btn.dataset.skinId;
                        const skin = SKINS.find(s => s.id === skinId);
                        if (ownedSkins.includes(skinId)) {
                            applySkin(skinId);
                            renderSkins();
                        } else if (balance >= skin.price) {
                            balance -= skin.price;
                            ownedSkins.push(skinId);
                            refreshUI();
                            renderSkins();
                            saveData();
                        }
                    });
                });
            }

            const coin3D = document.getElementById('coin3D');
            
            function tiltCoin(e) {
                const rect = coin3D.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const deltaX = (clientX - centerX) / (rect.width / 2);
                const deltaY = (clientY - centerY) / (rect.height / 2);
                coin3D.style.transform = `rotateX(${-deltaY * 18}deg) rotateY(${deltaX * 18}deg)`;
            }

            function resetTilt() {
                coin3D.style.transform = 'rotateX(0deg) rotateY(0deg)';
            }

            function handleTap(e) {
                if (e) e.preventDefault();
                tiltCoin(e);
                setTimeout(resetTilt, 180);
                
                if (currentEnergy < 1) {
                    document.getElementById('mineStatus').textContent = '❌ НЕТ ЭНЕРГИИ';
                    setTimeout(() => document.getElementById('mineStatus').textContent = '💎 ТАПАЙ ПО МОНЕТЕ', 800);
                    return;
                }
                currentEnergy--;
                let earned = 0.05 * tapMult;
                if (Math.random() < 0.1) earned *= 3;
                balance += earned;
                refreshUI();
                
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;
                const el = document.createElement('div');
                el.className = 'floating-score' + (earned > 0.1 ? ' crit' : '');
                el.textContent = '+' + earned.toFixed(2);
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 900);
                
                document.getElementById('mineStatus').textContent = `+${earned.toFixed(2)} HASK`;
                setTimeout(() => document.getElementById('mineStatus').textContent = '💎 ТАПАЙ ПО МОНЕТЕ', 500);
                saveData();
            }

            coin3D.addEventListener('click', handleTap);
            coin3D.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, { passive: false });
            coin3D.addEventListener('touchmove', (e) => { e.preventDefault(); tiltCoin(e); });
            coin3D.addEventListener('touchend', resetTilt);
            coin3D.addEventListener('mousemove', tiltCoin);
            coin3D.addEventListener('mouseleave', resetTilt);

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
                });
            });

            document.getElementById('regenBtn').addEventListener('click', () => {
                if (balance >= 20) { balance -= 20; currentEnergy = maxEnergy; refreshUI(); saveData(); }
            });

            document.getElementById('bonusBtn').addEventListener('click', () => {
                balance += 5; refreshUI(); saveData();
            });

            document.getElementById('openSupportBtn').addEventListener('click', () => {
                tg.openTelegramLink('https://t.me/KU1003');
            });

            function regen() {
                if (currentEnergy < maxEnergy) {
                    currentEnergy = Math.min(currentEnergy + 1 * regenMult, maxEnergy);
                    refreshUI();
                    saveData();
                }
            }

            // Рендер прокачки
            const upgradeGrid = document.getElementById('upgradeGrid');
            upgradeGrid.innerHTML = `
                <div class="upgrade-card"><div class="upgrade-icon">⚡</div><h4 style="color:#ffd700;">Энергия</h4><button class="upgrade-btn">5 HASK</button></div>
                <div class="upgrade-card"><div class="upgrade-icon">⛏️</div><h4 style="color:#ffd700;">Сила тапа</h4><button class="upgrade-btn">10 HASK</button></div>
                <div class="upgrade-card"><div class="upgrade-icon">🔄</div><h4 style="color:#ffd700;">Реген</h4><button class="upgrade-btn">8 HASK</button></div>
                <div class="upgrade-card"><div class="upgrade-icon">🤖</div><h4 style="color:#ffd700;">Автоклик</h4><button class="upgrade-btn">20 HASK</button></div>
            `;

            loadData();
            setInterval(regen, 5000);
            window.addEventListener('beforeunload', saveData);
        })();
    </script>
</body>
</html>
