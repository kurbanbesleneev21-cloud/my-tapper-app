<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kurban Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .score-container {
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Золотая монета на чистом CSS */
        .coin {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #f39c12, #f1c40f);
            border-radius: 50%;
            border: 8px solid #e67e22;
            box-shadow: 0 0 30px rgba(243, 156, 18, 0.6), inset 0 0 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.05s;
        }

        .coin:active {
            transform: scale(0.9);
        }

        .plus-one {
            position: absolute;
            color: #f1c40f;
            font-size: 30px;
            font-weight: bold;
            animation: moveUp 0.6s linear forwards;
            pointer-events: none;
        }

        @keyframes moveUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }
    </style>
</head>
<body>

    <div class="score-container" id="score">0</div>
    
    <div class="coin" id="coin">💰</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseInt(localStorage.getItem('score')) || 0;
        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');

        scoreEl.innerText = score;

        coinEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            score++;
            scoreEl.innerText = score;
            localStorage.setItem('score', score);

            // Вибрация
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Анимация +1
            const touch = e.touches[0];
            const plus = document.createElement('div');
            plus.classList.add('plus-one');
            plus.innerText = '+1';
            plus.style.left = touch.clientX + 'px';
            plus.style.top = touch.clientY + 'px';
            document.body.appendChild(plus);

            setTimeout(() => plus.remove(), 600);
        });
    </script>
</body>
</html>
