<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TONPulse Miner</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- TON Connect UI -->
<script src="https://unpkg.com/@tonconnect/ui@2.0.2/dist/tonconnect-ui.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060912; --bg2:#0a0f1e;
  --s1:#0e1525; --s2:#121b2e; --s3:#172035; --s4:#1e2a3f;
  --border:rgba(255,255,255,0.055); --border2:rgba(255,255,255,0.1);
  --blue:#3b7ef8; --blue2:#5b9bff; --blue3:#7ab8ff;
  --blue-g:rgba(59,126,248,0.18); --blue-glow:rgba(59,126,248,0.35);
  --gold:#f5c518; --gold2:#ffd84d;
  --gold-g:rgba(245,197,24,0.12); --gold-glow:rgba(245,197,24,0.3);
  --green:#22d87a; --green-g:rgba(34,216,122,0.12);
  --red:#ff5c5c; --purple:#a855f7;
  --text:#eaf0ff; --text2:#8fa3c8; --text3:#4a6080;
  --radius:18px; --radius-sm:12px;
  --nav-h:78px; --safe-bot:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg);font-family:'Nunito',sans-serif;min-height:100vh;display:flex;justify-content:center;color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;border:none;outline:none}

/* Stars */
.stars-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.6}

/* App Shell */
.app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;overflow:hidden}
.app::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(59,126,248,.07) 0%,transparent 70%),radial-gradient(ellipse 60% 30% at 80% 80%,rgba(168,85,247,.04) 0%,transparent 60%),radial-gradient(ellipse 50% 25% at 10% 60%,rgba(245,197,24,.03) 0%,transparent 60%);pointer-events:none;z-index:0}
.app::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'
