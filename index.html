<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Clicker Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .score {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Perfect Clicker Game!</h1>
        <button class="button" id="clickerButton">Click me!</button>
        <div class="score" id="score">Clicks: 0</div>
    </div>
    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const clickerButton = document.getElementById('clickerButton');

        clickerButton.addEventListener('click', () => {
            score++;
            scoreDisplay.innerText = 'Clicks: ' + score;
            smoothAnimation();
        });

        function smoothAnimation() {
            clickerButton.style.transform = 'scale(1.1)';
            setTimeout(() => clickerButton.style.transform = 'scale(1)', 300);
        }
    </script>
</body>
</html>
