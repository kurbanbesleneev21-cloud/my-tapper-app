<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HASKOIN PREMIUM</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #fbbf24;
            --secondary: #3b82f6;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Инфографика фона */
        .glow {
            position: fixed;
            width: 150vw;
            height: 150vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            top: -50%; left: -25%; z-index: -1;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        /* Счётчик как в топовых играх */
        .score-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 10px;
        }

        .hask-title { color: #94a3b8; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        .balance {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 5px 0;
        }

        /* Главная монета - Инфографика клика */
        .coin-section {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .coin {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 35% 35%, #fde68a 0%, #d97706 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            font-weight: 900;
            color: #78350f;
            border: 10px solid #b45309;
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.4), inset 0 5px 15px rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.05s;
            position: relative;
        }

        .coin:active { transform: scale(0.92); }

        /* Полоска энергии */
        .status-bar {
            margin-bottom: 100px;
        }

        .energy-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .progress-bg {
            height: 14px;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), #60a5fa);
            width: 100%;
            transition: width 0.3s;
            box-shadow: 0 0 15px var(--secondary);
        }

        /* Нижнее меню */
        .menu {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 20px;
            display: flex;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .menu-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            font-size: 11px;
            text-decoration: none;
        }

        .menu-item.active { color: var(--primary); }

        /* Анимация +0.05 */
        .tap-msg {
            position: absolute;
            color: var(--primary);
            font-weight: 900;
            font-size: 32px;
            pointer-events: none;
            animation: moveUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes moveUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-150px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="score-card">
            <p class="hask-title">Баланс HASKOIN</p>
            <div class="balance" id="balance">0.00</div>
            <p style="color: #64748b;">≈ <span id="rub">0</span> ₽</p>
        </div>

        <div class="coin-section">
            <div class="coin" id="coin">H</div>
        </div>

        <div class="status-bar">
            <div class="energy-info">
                <span>⚡ Энергия</span>
                <span id="energyText">1000/1000</span>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="energyFill"></div>
            </div>
        </div>
    </div>

    <nav class="menu">
        <a href="#" class="menu-item active"><i data-lucide="pickaxe"></i>Игра</a>
        <a href="#" class="menu-item"><i data-lucide="zap"></i>Бусты</a>
        <a href="#" class="menu-item"><i data-lucide="users"></i>Друзья</a>
        <a href="#" class="menu-item"><i data-lucide="wallet"></i>Вывод</a>
    </nav>

    <script>
        // Иконки
        lucide.createIcons();

        let count = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const coin = document.getElementById('coin');
        const balanceDisplay = document.getElementById('balance');
        const rubDisplay = document.getElementById('rub');
        const energyFill = document.getElementById('energyFill');
        const energyText = document.getElementById('energyText');

        coin.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy > 0) {
                count += 0.05;
                energy -= 1;
                
                // Обновляем текст
                balanceDisplay.innerText = count.toFixed(2);
                rubDisplay.innerText = Math.floor(count * 0.083);
                
                // Энергия
                const percent = (energy / maxEnergy) * 100;
                energyFill.style.width = percent + '%';
                energyText.innerText = `${energy}/${maxEnergy}`;

                // Анимация текста
                const touch = e.touches[0];
                const msg = document.createElement('div');
                msg.className = 'tap-msg';
                msg.innerText = '+0.05';
                msg.style.left = touch.pageX + 'px';
                msg.style.top = touch.pageY + 'px';
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 800);

                // Вибрация
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
            }
        });

        // Регенерация (бесплатно и просто)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(energy + 1, maxEnergy);
                energyFill.style.width = (energy / maxEnergy) * 100 + '%';
                energyText.innerText = `${energy}/${maxEnergy}`;
            }
        }, 2000);
    </script>
</body>
</html>
