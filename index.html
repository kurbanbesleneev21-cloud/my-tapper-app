<!DOCTYPE html><html lang="ru"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">    <title>HASKOIN TON Edition</title>    <script src="https://unpkg.com/lucide@latest"></script>    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">    <style>        :root {            --primary: #fbbf24;            --primary-dark: #d97706;            --ton: #0088cc;            --bg: #030712;            --card: rgba(255, 255, 255, 0.03);            --glass: rgba(17, 24, 39, 0.7);        }        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }                body {             background: radial-gradient(circle at top, #111827 0%, #030712 100%);             color: #f8fafc;             overflow: hidden;             height: 100vh;        }        .container { padding: 20px; display: flex; flex-direction: column; height: 100vh; max-width: 450px; margin: 0 auto; position: relative; }        /* Красивый баланс */        .balance-card {            background: var(--card);            backdrop-filter: blur(10px);            border-radius: 28px;            padding: 25px;            text-align: center;            border: 1px solid rgba(255,255,255,0.1);            margin-top: 10px;            box-shadow: 0 10px 30px rgba(0,0,0,0.5);        }        .balance-label { font-size: 11px; letter-spacing: 2px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }        .balance-val {             font-family: 'Montserrat', sans-serif;            font-size: 48px;             font-weight: 900;             color: #fff;            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);            display: flex;            align-items: center;            justify-content: center;            gap: 10px;        }        /* Монета с анимацией */        .coin-wrap {             flex-grow: 1;             display: flex;             align-items: center;             justify-content: center;             perspective: 1000px;            position: relative;        }                .coin {            width: 240px; height: 240px;            background: radial-gradient(circle at 35% 35%, #fbbf24, #78350f);            border-radius: 50%;            border: 10px solid #fbbf24;            display: flex; align-items: center; justify-content: center;            font-family: 'Montserrat', sans-serif;            font-size: 100px; font-weight: 900; color: #78350f;            box-shadow: 0 0 60px rgba(251, 191, 36, 0.15), inset 0 0 20px rgba(0,0,0,0.5);            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);            user-select: none;            cursor: pointer;            position: relative;            z-index: 2;        }        /* Эффект вылетающих цифр */        .tap-particle {            position: absolute;            color: #fbbf24;            font-weight: 900;            font-size: 24px;            pointer-events: none;            animation: floatUp 0.8s ease-out forwards;            z-index: 10;            text-shadow: 0 2px 10px rgba(0,0,0,0.5);        }        @keyframes floatUp {            0% { transform: translateY(0) scale(1); opacity: 1; }            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }        }        /* Энергия */        .energy-container {            background: var(--card);            padding: 15px 20px;            border-radius: 20px;            margin-bottom: 110px;            border: 1px solid rgba(255,255,255,0.05);        }        .energy-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: 600; }        .energy-bar-bg { height: 12px; background: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }        .energy-bar-fill {             height: 100%; width: 100%;             background: linear-gradient(90deg, var(--ton), #38bdf8);             box-shadow: 0 0 15px var(--ton);            transition: width 0.3s ease;        }        /* Навигация */        .nav {            position: fixed; bottom: 25px; left: 20px; right: 20px;            background: var(--glass);            backdrop-filter: blur(15px);            border-radius: 24px; display: flex; padding: 8px;            border: 1px solid rgba(255,255,255,0.1);            box-shadow: 0 15px 35px rgba(0,0,0,0.4);        }        .nav-item {            flex: 1; border: none; background: none; color: #64748b;            display: flex; flex-direction: column; align-items: center; gap: 4px;             font-size: 11px; font-weight: 600; transition: 0.2s;            padding: 10px 0;        }        .nav-item.active { color: var(--primary); transform: translateY(-5px); }        .nav-item i { margin-bottom: 2px; }        /* Формы */        .input-field {            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #374151;            padding: 16px; border-radius: 16px; color: white; margin-top: 5px;            transition: 0.3s;        }        .input-field:focus { border-color: var(--ton); background: rgba(0,0,0,0.5); }        .btn-send {            background: linear-gradient(135deg, #10b981, #059669);            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);            border: none; padding: 18px; border-radius: 16px; width: 100%;            color: white; font-weight: 900; font-size: 16px; margin-top: 20px;        }        .screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.4s ease; }        .screen.active { display: flex; }        @keyframes fadeIn { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }    </style></head><body>    <div class="container">        <!-- Экран Игры -->        <div id="game" class="screen active">            <div class="balance-card">                <p class="balance-label">TOTAL BALANCE</p>                <div class="balance-val">                    <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" width="32" alt="ton">                    <span id="balance">0.00</span>                </div>            </div>            <div class="coin-wrap" id="tapArea">                <div class="coin" id="coinBtn">H</div>            </div>            <div class="energy-container">                <div class="energy-header">                    <span>⚡ Energy</span>                    <span id="e-txt">1000/1000</span>                </div>                <div class="energy-bar-bg">                    <div id="e-bar" class="energy-bar-fill"></div>                </div>            </div>        </div>        <!-- Экран Вывода -->        <div id="wallet" class="screen">            <h2 style="margin: 20px 0; font-family: 'Montserrat';">Withdraw HASK</h2>            <div style="background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);">                <div style="margin-bottom: 15px;">                    <label style="font-size: 12px; color: #94a3b8; font-weight: 600;">FULL NAME</label>                    <input type="text" id="w-name" class="input-field" placeholder="Enter your name">                </div>                <div style="margin-bottom: 15px;">                    <label style="font-size: 12px; color: #94a3b8; font-weight: 600;">TON WALLET ADDRESS</label>                    <input type="text" id="w-address" class="input-field" placeholder="UQAr...xxxx">                </div>                <div>                    <label style="font-size: 12px; color: #94a3b8; font-weight: 600;">AMOUNT</label>                    <input type="number" id="w-amount" class="input-field" readonly>                </div>                <button class="btn-send" onclick="sendAutoWithdraw()">SEND REQUEST</button>                <p id="status" style="margin-top:15px; text-align:center; font-weight:600;"></p>            </div>        </div>        <!-- Экран Друзей -->        <div id="friends" class="screen">            <h2 style="margin: 20px 0; font-family: 'Montserrat';">Invite Friends</h2>            <div class="balance-card">                <i data-lucide="gift" style="color: var(--primary); margin-bottom: 10px;"></i>                <p style="font-size: 14px; line-height: 1.5;">Invite friends and get 10% of their earnings!</p>                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin: 20px 0; font-size: 12px; color: var(--ton); word-break: break-all;">                    t.me/haskoin_bot?start=6735777649                </div>                <button onclick="copyRef()" style="background: var(--primary); border:none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 900; color: #78350f;">COPY LINK</button>            </div>        </div>    </div>    <nav class="nav">        <button class="nav-item active" onclick="nav('game')"><i data-lucide="coins"></i>Mine</button>        <button class="nav-item" onclick="nav('friends')"><i data-lucide="users"></i>Friends</button>        <button class="nav-item" onclick="nav('wallet')"><i data-lucide="wallet"></i>Wallet</button>    </nav>    <script>        lucide.createIcons();        let bal = parseFloat(localStorage.getItem('h_bal')) || 0;        let energy = parseInt(localStorage.getItem('h_energy')) || 1000;                const BOT_TOKEN = "8672019950:AAF6HWX4zsz-CDWdXZGAAQctYdjfI8oaYWs";        const ADMIN_ID = "6735777649";         function nav(id) {            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));            document.getElementById(id).classList.add('active');            event.currentTarget.classList.add('active');            if(id === 'wallet') document.getElementById('w-amount').value = bal.toFixed(2);        }        const coinBtn = document.getElementById('coinBtn');        const tapArea = document.getElementById('tapArea');        tapArea.addEventListener('touchstart', (e) => {            e.preventDefault();            if(energy <= 0) return;            const touch = e.touches[0];            createParticle(touch.clientX, touch.clientY);                        // Вибрация            if (navigator.vibrate) navigator.vibrate(10);            // 3D эффект наклона            const rect = coinBtn.getBoundingClientRect();            const x = touch.clientX - rect.left - rect.width/2;            const y = touch.clientY - rect.top - rect.height/2;            coinBtn.style.transform = `scale(0.95) rotateX(${-y/5}deg) rotateY(${x/5}deg)`;            bal += 0.05;            energy -= 1;            update();                        setTimeout(() => {                coinBtn.style.transform = 'scale(1) rotateX(0) rotateY(0)';            }, 100);        });        function createParticle(x, y) {            const p = document.createElement('div');            p.className = 'tap-particle';            p.innerText = '+0.05';            p.style.left = x + 'px';            p.style.top = y + 'px';            document.body.appendChild(p);            setTimeout(() => p.remove(), 800);        }        function update() {            document.getElementById('balance').innerText = bal.toFixed(2);            document.getElementById('e-txt').innerText = energy + '/1000';            document.getElementById('e-bar').style.width = (energy/10) + '%';            localStorage.setItem('h_bal', bal);            localStorage.setItem('h_energy', energy);        }        function copyRef() {            navigator.clipboard.writeText('t.me/haskoin_bot?start=6735777649');            alert('Ссылка скопирована!');        }        async function sendAutoWithdraw() {            const name = document.getElementById('w-name').value;            const addr = document.getElementById('w-address').value;            const status = document.getElementById('status');            if(!name || !addr) return alert('Fill all fields!');            if(bal < 3000) return alert('Minimum 3000 HASK required');            status.style.color = "#fbbf24";            status.innerText = "⏳ Processing...";            const message = `🚀 <b>NEW WITHDRAWAL!</b>%0A%0A👤 User: ${name}%0A💰 Amount: ${bal.toFixed(2)} HASK%0A🏦 Wallet: <code>${addr}</code>`;            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${message}&parse_mode=html`;            try {                const response = await fetch(url);                if(response.ok) {                    status.style.color = "#10b981";                    status.innerText = "✅ Success! Sent to Kurban.";                    bal = 0;                    update();                } else {                    status.innerText = "❌ Error. Try again.";                }            } catch (e) {                status.innerText = "❌ Network error.";            }        }        // Регенерация энергии        setInterval(() => {            if(energy < 1000) {                energy = Math.min(1000, energy + 1);                update();            }        }, 1500);        update();    </script></body></html>
