<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HASKOIN PREMIUM</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #fbbf24;
            --secondary: #3b82f6;
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.8);
            --text-main: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Улучшенный живой фон */
        .bg-animate {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(251, 191, 36, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 450px;
            margin: 0 auto;
            position: relative;
        }

        /* Навигационные экраны */
        .screen { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.3s ease; }
        .screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Счётчик */
        .score-header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 10px;
        }

        .balance {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Анимированный токен */
        .coin-section {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .coin {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle at 30% 30%, #fde68a, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            font-weight: 900;
            color: #78350f;
            border: 8px solid #b45309;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 4px 10px rgba(255,255,255,0.5);
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* Эффект нажатия */
        .coin:active {
            transform: scale(0.9) rotateX(10deg);
        }

        /* Энергия */
        .energy-box { margin-bottom: 110px; }
        .progress-track {
            height: 12px;
            background: #1f2937;
            border-radius: 20px;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), #60a5fa);
            width: 100%;
            transition: width 0.3s;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Кнопки меню */
        .nav-menu {
            position: fixed;
            bottom: 25px;
            left: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 22px;
            display: flex;
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            justify-content: space-around;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #64748b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            flex: 1;
            padding: 10px 0;
            transition: 0.2s;
        }

        .nav-btn.active { color: var(--primary); }
        .nav-btn.active i { transform: translateY(-3px); color: var(--primary); }

        /* Всплывающие цифры */
        .float-val {
            position: absolute;
            color: var(--primary);
            font-weight: 900;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        /* Заглушки для других экранов */
        .placeholder {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-animate"></div>
    
    <div class="container">
        <div id="game-screen" class="screen active">
            <div class="score-header">
                <p style="color: #94a3b8; font-size: 12px; letter-spacing: 1px;">БАЛАНС HASKOIN</p>
                <div class="balance" id="balance">0.00</div>
                <p style="color: #64748b; font-size: 14px;">≈ <span id="rub">0</span> ₽</p>
            </div>

            <div class="coin-section">
                <div class="coin" id="tap-coin">H</div>
            </div>

            <div class="energy-box">
                <div style="display: flex; justify-content: space-between; font-size: 13px;">
                    <span>⚡ Энергия</span>
                    <span id="energy-text">1000/1000</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="energy-bar"></div>
                </div>
            </div>
        </div>

        <div id="boosts-screen" class="screen">
            <h2 style="margin-top: 20px; text-align: center;">Магазин Бустов</h2>
            <div class="placeholder">
                <i data-lucide="rocket" style="width: 48px; height: 48px; color: var(--primary); margin-bottom: 15px;"></i>
                <p>Улучшения появятся в следующем обновлении!</p>
            </div>
        </div>

        <div id="wallet-screen" class="screen">
            <h2 style="margin-top: 20px; text-align: center;">Кошелек</h2>
            <div class="placeholder">
                <i data-lucide="wallet" style="width: 48px; height: 48px; color: var(--secondary); margin-bottom: 15px;"></i>
                <p>Минимальный вывод: 3000 HASK</p>
                <button style="margin-top: 20px; padding: 10px 20px; border-radius: 10px; border: none; background: #334155; color: white;">Привязать карту</button>
            </div>
        </div>
    </div>

    <nav class="nav-menu">
        <button class="nav-btn active" onclick="showScreen('game')">
            <i data-lucide="gamepad-2"></i><span>Игра</span>
        </button>
        <button class="nav-btn" onclick="showScreen('boosts')">
            <i data-lucide="zap"></i><span>Бусты</span>
        </button>
        <button class="nav-btn" onclick="showScreen('wallet')">
            <i data-lucide="wallet"></i><span>Вывод</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        let balance = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const coin = document.getElementById('tap-coin');
        const balanceTxt = document.getElementById('balance');
        const rubTxt = document.getElementById('rub');
        const energyBar = document.getElementById('energy-bar');
        const energyTxt = document.getElementById('energy-text');

        // Функция переключения экранов
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(screenId + '-screen').classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Обработка тапа
        coin.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy > 0) {
                balance += 0.05;
                energy -= 1;
                
                balanceTxt.innerText = balance.toFixed(2);
                rubTxt.innerText = Math.floor(balance * 0.083);
                
                const percent = (energy / maxEnergy) * 100;
                energyBar.style.width = percent + '%';
                energyTxt.innerText = `${energy}/${maxEnergy}`;

                // Всплывающее число
                const touch = e.touches[0];
                const val = document.createElement('div');
                val.className = 'float-val';
                val.innerText = '+0.05';
                val.style.left = (touch.pageX - 20) + 'px';
                val.style.top = (touch.pageY - 40) + 'px';
                document.body.appendChild(val);
                setTimeout(() => val.remove(), 800);

                // Тактильный отклик
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                }
            }
        });

        // Регенерация энергии
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(energy + 1, maxEnergy);
                energyBar.style.width = (energy / maxEnergy) * 100 + '%';
                energyTxt.innerText = `${energy}/${maxEnergy}`;
            }
        }, 1500);
    </script>
</body>
</html>
