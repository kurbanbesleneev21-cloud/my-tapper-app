<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NovaPulse Miner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a0b2e, #050510);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* Декоративный фон */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Заголовок */
        .title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00E5FF, #7B2FF7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        }

        /* Блок баланса */
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 20px 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(123, 47, 247, 0.2);
        }

        .coin-icon {
            font-size: 2.8rem;
            filter: drop-shadow(0 0 12px #00E5FF);
        }

        .balance-info {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
        }

        #balance {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #E0E7FF, #00E5FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Шкала энергии */
        .energy-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 15px 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .energy-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #ccc;
        }

        .energy-bar {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }

        #energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #7B2FF7, #00E5FF);
            box-shadow: 0 0 15px #00E5FFaa;
            transition: width 0.1s linear;
            border-radius: 20px;
        }

        /* Кнопка-тапалка (монетка) */
        .tap-area {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a1c71, #0f0c29);
            box-shadow: 0 0 40px rgba(123, 47, 247, 0.7), 0 15px 30px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 3px solid rgba(0, 229, 255, 0.3);
            animation: pulse-glow 2.5s infinite;
        }

        .tap-area:active {
            transform: scale(0.92);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 25px rgba(0, 229, 255, 0.5), 0 10px 25px rgba(0,0,0,0.8); }
            50% { box-shadow: 0 0 60px rgba(123, 47, 247, 0.8), 0 10px 35px rgba(0,0,0,0.8); }
            100% { box-shadow: 0 0 25px rgba(0, 229, 255, 0.5), 0 10px 25px rgba(0,0,0,0.8); }
        }

        .tap-emoji {
            font-size: 5rem;
            filter: drop-shadow(0 0 20px #00E5FF);
            pointer-events: none;
        }

        /* Всплывающие +1 */
        .float-number {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.6rem;
            color: #00E5FF;
            text-shadow: 0 0 15px #7B2FF7;
            animation: floatUp 0.9s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-90px) scale(1.8);
            }
        }

        /* Подсказка */
        .hint {
            color: #ffffff88;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Адаптивность */
        @media (max-width: 400px) {
            .tap-area {
                width: 150px;
                height: 150px;
            }
            .tap-emoji {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">NovaPulse Miner</h1>

        <div class="balance-card">
            <span class="coin-icon">💎</span>
            <div class="balance-info">
                <span class="balance-label">Баланс</span>
                <span id="balance">0</span>
            </div>
        </div>

        <div class="energy-section">
            <div class="energy-header">
                <span>⚡ Энергия</span>
                <span id="energy-text">500 / 500</span>
            </div>
            <div class="energy-bar">
                <div id="energy-fill" style="width: 100%;"></div>
            </div>
        </div>

        <div class="tap-area" id="tapButton">
            <span class="tap-emoji">🪐</span>
        </div>

        <div class="hint">Тапай по планете, зарабатывай монеты!</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем на весь экран
        tg.setBackgroundColor('#050510');
        tg.setHeaderColor('#1a0b2e');

        // Основные переменные
        let balance = 0;
        let maxEnergy = 500;
        let currentEnergy = maxEnergy;
        let energyPerTap = 1;      // трата энергии за тап
        let coinsPerTap = 1;
        let energyRegen = 1;       // восст. энергии в секунду
        const regenInterval = 100; // мс

        const balanceElement = document.getElementById('balance');
        const energyFill = document.getElementById('energy-fill');
        const energyText = document.getElementById('energy-text');
        const tapButton = document.getElementById('tapButton');

        // Обновление UI
        function updateUI() {
            balanceElement.textContent = Math.floor(balance);
            let percent = (currentEnergy / maxEnergy) * 100;
            energyFill.style.width = `${percent}%`;
            energyText.textContent = `${Math.floor(currentEnergy)} / ${maxEnergy}`;
        }

        // Анимация вылета чисел
        function spawnFloatNumber(x, y, amount) {
            const floatEl = document.createElement('div');
            floatEl.className = 'float-number';
            floatEl.textContent = `+${amount}`;
            // Позиционируем относительно tap-area
            floatEl.style.left = `${x}px`;
            floatEl.style.top = `${y}px`;
            tapButton.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 800);
        }

        // Обработчик тапа
        tapButton.addEventListener('pointerdown', function(e) {
            if (currentEnergy < energyPerTap) {
                // Если нет энергии — вибрация (если доступна) и выход
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(30);
                }
                return;
            }

            // Уменьшаем энергию, увеличиваем баланс
            currentEnergy -= energyPerTap;
            balance += coinsPerTap;

            // Получаем координаты касания относительно кнопки
            const rect = tapButton.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Анимация
            spawnFloatNumber(x - 15, y - 30, coinsPerTap);
            
            // Легкая вибрация (если поддерживается)
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }

            updateUI();

            // Отправляем данные в бота (опционально)
            tg.sendData(JSON.stringify({ action: 'tap', balance: Math.floor(balance) }));
        });

        // Восстановление энергии
        setInterval(() => {
            if (currentEnergy < maxEnergy) {
                currentEnergy = Math.min(maxEnergy, currentEnergy + energyRegen * (regenInterval / 1000));
                updateUI();
            }
        }, regenInterval);

        // Загрузка сохраненных данных (если были переданы через Telegram)
        tg.ready();
        // Можно позже загрузить баланс с сервера через CloudStorage или запрос к боту
        // Для демо просто стартуем с 0
        updateUI();
    </script>
</body>
</html>
