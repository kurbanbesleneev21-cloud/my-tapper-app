<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HASKOIN TON Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #fbbf24;
            --ton: #0088cc;
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg); color: #f8fafc; overflow: hidden; height: 100vh; }

        .container { padding: 20px; display: flex; flex-direction: column; height: 100vh; max-width: 450px; margin: 0 auto; }

        /* Экраны */
        .screen { display: none; flex-direction: column; height: 100%; animation: slideUp 0.3s ease; }
        .screen.active { display: flex; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Баланс */
        .balance-card {
            background: var(--card);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .balance-val { font-size: 44px; font-weight: 900; color: var(--primary); }

        /* Монета */
        .coin-wrap { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .coin {
            width: 220px; height: 220px;
            background: radial-gradient(circle at 30% 30%, #fde68a, #d97706);
            border-radius: 50%;
            border: 8px solid #78350f;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; font-weight: 900; color: #78350f;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
            transition: transform 0.1s;
        }
        .coin:active { transform: scale(0.92); }

        /* Анкета вывода */
        .withdraw-form {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .input-field {
            width: 100%;
            background: #111827;
            border: 1px solid #374151;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }
        .input-field:focus { border-color: var(--ton); outline: none; }

        .btn-send {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* Меню */
        .nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 20px; display: flex; padding: 10px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
        .nav-item {
            flex: 1; border: none; background: none; color: #64748b;
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px;
        }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <div id="game" class="screen active">
            <div class="balance-card">
                <p style="color: #94a3b8; font-size: 12px;">МОЙ БАЛАНС</p>
                <div class="balance-val" id="balance">0.00</div>
            </div>
            <div class="coin-wrap">
                <div class="coin" id="coinBtn">H</div>
            </div>
            <div style="margin-bottom: 100px;">
                <p style="font-size: 12px; margin-bottom: 5px;">⚡ Энергия: <span id="e-txt">1000/1000</span></p>
                <div style="height: 8px; background: #1e293b; border-radius: 10px; overflow: hidden;">
                    <div id="e-bar" style="height: 100%; width: 100%; background: var(--ton);"></div>
                </div>
            </div>
        </div>

        <div id="wallet" class="screen">
            <h2 style="margin: 10px 0 20px;">Оформить заявку</h2>
            <div class="withdraw-form">
                <div class="input-group">
                    <label>Ваше имя</label>
                    <input type="text" id="w-name" class="input-field" placeholder="Введите имя">
                </div>
                <div class="input-group">
                    <label>Адрес кошелька TON</label>
                    <input type="text" id="w-address" class="input-field" placeholder="UQAr...ваш адрес">
                </div>
                <div class="input-group">
                    <label>Сумма к выводу (HASK)</label>
                    <input type="number" id="w-amount" class="input-field" readonly>
                </div>
                <button class="btn-send" onclick="sendAutoWithdraw()">ОТПРАВИТЬ ЗАЯВКУ</button>
                <p id="status" style="margin-top:10px; font-size:12px; text-align:center; color: #10b981;"></p>
            </div>
        </div>

        <div id="friends" class="screen">
            <h2 style="margin-top: 20px;">Друзья</h2>
            <div class="balance-card" style="margin-top: 20px;">
                <p>Ваша ссылка:</p>
                <p style="font-size: 12px; color: var(--ton); margin: 10px 0;">t.me/haskoin_bot?start=6735777649</p>
                <button style="background: var(--primary); border:none; padding: 10px; border-radius: 10px; width: 100%; font-weight: bold;">Копировать</button>
            </div>
        </div>
    </div>

    <nav class="nav">
        <button class="nav-item active" onclick="nav('game')"><i data-lucide="coins"></i>Игра</button>
        <button class="nav-item" onclick="nav('friends')"><i data-lucide="users"></i>Друзья</button>
        <button class="nav-item" onclick="nav('wallet')"><i data-lucide="wallet"></i>Вывод</button>
    </nav>

    <script>
        lucide.createIcons();
        let bal = parseFloat(localStorage.getItem('h_bal')) || 0;
        let energy = 1000;
        
        // ТВОИ ДАННЫЕ (Уже вписаны)
        const BOT_TOKEN = "8672019950:AAF6HWX4zsz-CDWdXZGAAQctYdjfI8oaYWs";
        const ADMIN_ID = "6735777649"; 

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'wallet') document.getElementById('w-amount').value = bal.toFixed(2);
        }

        document.getElementById('coinBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(energy > 0) {
                bal += 0.05; energy -= 1;
                update();
                localStorage.setItem('h_bal', bal);
            }
        });

        function update() {
            document.getElementById('balance').innerText = bal.toFixed(2);
            document.getElementById('e-txt').innerText = energy + '/1000';
            document.getElementById('e-bar').style.width = (energy/10) + '%';
        }

        async function sendAutoWithdraw() {
            const name = document.getElementById('w-name').value;
            const addr = document.getElementById('w-address').value;
            const status = document.getElementById('status');

            if(!name || !addr) return alert('Заполните все поля!');
            if(bal < 3000) return alert('Минимальный вывод от 3000 HASK');

            status.innerText = "Отправка...";

            const message = `🚀 НОВАЯ ЗАЯВКА НА ВЫВОД!%0A%0A👤 Имя: ${name}%0A💰 Сумма: ${bal.toFixed(2)} HASK%0A🏦 Кошелек: ${addr}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${message}&parse_mode=html`;

            try {
                const response = await fetch(url);
                if(response.ok) {
                    status.innerText = "✅ Заявка успешно отправлена Курбану!";
                    bal = 0; // Сбрасываем баланс после успешной заявки
                    localStorage.setItem('h_bal', bal);
                    update();
                } else {
                    status.innerText = "❌ Ошибка при отправке. Попробуйте позже.";
                }
            } catch (e) {
                status.innerText = "❌ Ошибка сети.";
            }
        }

        setInterval(() => { if(energy < 1000) { energy++; update(); } }, 2000);
        update();
    </script>
</body>
</html>
