<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HASKOIN · Премиум Тапалка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #020108;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            overflow-x: hidden;
        }

        /* АНИМИРОВАННЫЙ ФОН */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
        }

        .bg-gradient-1 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.08) 0%, transparent 50%);
            animation: moveGradient1 15s infinite alternate ease-in-out;
        }

        .bg-gradient-2 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.06) 0%, transparent 50%);
            animation: moveGradient2 18s infinite alternate ease-in-out;
        }

        .bg-gradient-3 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
            animation: pulse 8s infinite ease-in-out;
        }

        @keyframes moveGradient1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 3%) scale(1.1); }
        }

        @keyframes moveGradient2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, -4%) scale(1.15); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* СЕТКА */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: gridShift 20s linear infinite;
        }

        @keyframes gridShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* ЧАСТИЦЫ */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            border-radius: 50%;
            opacity: 0.4;
            animation: floatParticle 12s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
            25% { transform: translateY(-60px) scale(1.5); opacity: 0.6; }
            50% { transform: translateY(-30px) scale(1); opacity: 0.3; }
            75% { transform: translateY(-80px) scale(1.8); opacity: 0.5; }
        }

        .app {
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px 8px;
            scrollbar-width: none;
        }

        .page-content::-webkit-scrollbar { display: none; }

        .page { 
            display: none;
            animation: pageFadeIn 0.4s ease-out;
        }

        .page.active { display: block; }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 10, 25, 0.85);
            backdrop-filter: blur(20px);
            padding: 8px 16px 8px 8px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 255, 255, 0.1);
        }

        .player-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #00ffff, #0066ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #020108;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), inset 0 2px 4px rgba(255,255,255,0.3);
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .player-status {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #00ffaa;
            font-size: 11px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #00ffaa;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .rank-badge {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 13px;
            color: #020108;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), inset 0 1px 3px rgba(255,255,255,0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        /* КАРТОЧКА БАЛАНСА */
        .balance-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            backdrop-filter: blur(25px);
            border-radius: 32px;
            padding: 22px 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(0, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .balance-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .balance-icon {
            font-size: 20px;
            animation: coinSpin 4s infinite linear;
        }

        @keyframes coinSpin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .balance-title {
            color: #00ffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #00ffff;
        }

        .balance-main {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
        }

        .balance-number {
            font-size: 58px;
            font-weight: 900;
            background: linear-gradient(145deg, #ffffff, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            letter-spacing: -1px;
        }

        .balance-currency {
            color: #ffd700;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 15px #ffd700;
        }

        .balance-stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 255, 0.06);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.15);
        }

        .stat-icon {
            font-size: 18px;
        }

        .stat-value {
            color: #00ffaa;
            font-weight: 700;
            font-size: 15px;
        }

        .stat-label {
            color: #8888aa;
            font-size: 12px;
            margin-left: 4px;
        }

        .tap-stat {
            background: rgba(255, 215, 0, 0.08);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .tap-stat span {
            color: #ffd700;
            font-weight: 800;
            font-size: 18px;
        }

        /* ЭНЕРГИЯ */
        .energy-section {
            margin-bottom: 18px;
        }

        .energy-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .energy-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .energy-value {
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
        }

        .energy-bar-container {
            height: 14px;
            background: rgba(10, 10, 20, 0.8);
            border-radius: 30px;
            padding: 2px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00ffaa, #ffd700);
            border-radius: 30px;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px #00ffff, inset 0 1px 2px rgba(255,255,255,0.5);
            position: relative;
            overflow: hidden;
        }

        .energy-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .energy-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        .regen-info {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #00ffaa;
            font-size: 12px;
        }

        .energy-tip {
            color: #8888aa;
            font-size: 11px;
        }

        /* 3D МОНЕТА */
        .coin-container {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px;
            position: relative;
            perspective: 1200px;
        }

        .coin-aura {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, rgba(255, 215, 0, 0.15) 40%, transparent 70%);
            border-radius: 50%;
            animation: auraPulse 3s infinite alternate;
            pointer-events: none;
        }

        @keyframes auraPulse {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 0.7; transform: scale(1.15); }
        }

        .coin-3d {
            width: 240px;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            filter: drop-shadow(0 0 40px rgba(0, 255, 255, 0.3));
        }

        .coin-3d:active {
            transition: transform 0.1s ease-out;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            box-shadow: 
                0 0 0 6px rgba(255, 215, 0, 0.4),
                0 0 0 12px rgba(0, 255, 255, 0.2),
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 -12px 18px rgba(0, 0, 0, 0.4),
                inset 0 12px 20px rgba(255, 255, 255, 0.4),
                0 0 80px rgba(0, 255, 255, 0.3);
            border: 4px solid #ffd700;
            pointer-events: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .coin-face::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                repeating-radial-gradient(circle at 30% 40%, transparent 0, rgba(0,0,0,0.08) 5px, transparent 10px),
                repeating-linear-gradient(45deg, transparent 0, rgba(255,255,255,0.04) 3px, transparent 6px);
            pointer-events: none;
        }

        .coin-face::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px #00ffff, inset 0 0 15px rgba(0, 255, 255, 0.5);
            opacity: 0.8;
            pointer-events: none;
            animation: neonFlicker 3s infinite;
        }

        @keyframes neonFlicker {
            0%, 100% { opacity: 0.7; box-shadow: 0 0 20px #00ffff, inset 0 0 10px #00ffff; }
            50% { opacity: 1; box-shadow: 0 0 40px #00ffff, inset 0 0 20px #00ffff; }
        }

        .coin-shine {
            position: absolute;
            top: 6%;
            left: 10%;
            width: 40%;
            height: 22%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.2) 60%, transparent 90%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(3px);
        }

        .coin-letter {
            font-size: 88px;
            font-weight: 900;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            pointer-events: none;
            letter-spacing: 4px;
            transform: translateZ(15px);
            text-shadow: 6px 8px 0 rgba(0, 0, 0, 0.3);
        }

        .coin-tap-label {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 900;
            font-size: 18px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            border: 2px solid rgba(0, 255, 255, 0.6);
            letter-spacing: 6px;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.2);
        }

        /* ЭФФЕКТ +МОНЕТЫ */
        .floating-score {
            position: absolute;
            font-size: 32px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 50px #ffd700, 0 0 30px #00ffff;
            pointer-events: none;
            z-index: 100;
            animation: flyUp 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            white-space: nowrap;
        }

        .floating-score.crit {
            color: #00ffff;
            font-size: 44px;
            text-shadow: 0 0 60px #00ffff, 0 0 30px #ffffff;
        }

        @keyframes flyUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-140px) scale(2); }
        }

        /* КНОПКИ ДЕЙСТВИЙ */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .game-btn {
            flex: 1;
            background: linear-gradient(145deg, #1a1a3e, #0d0d22);
            color: #00ffff;
            border: 1.5px solid rgba(0, 255, 255, 0.5);
            border-radius: 20px;
            padding: 16px 12px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 
                0 8px 0 #0a0a1a,
                0 0 30px rgba(0, 255, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.08s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 15px #00ffff;
            touch-action: manipulation;
            letter-spacing: 1px;
        }

        .game-btn:active {
            transform: translateY(6px);
            box-shadow: 
                0 2px 0 #0a0a1a,
                0 0 40px rgba(0, 255, 255, 0.4);
        }

        .game-btn.gold {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 
                0 8px 0 #1a1500,
                0 0 30px rgba(255, 215, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 15px #ffd700;
        }

        .game-btn.purple {
            color: #a78bfa;
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 
                0 8px 0 #1a1030,
                0 0 30px rgba(139, 92, 246, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 15px #a78bfa;
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-nav {
            background: linear-gradient(0deg, rgba(10, 10, 25, 0.98), rgba(20, 20, 45, 0.9));
            backdrop-filter: blur(30px);
            padding: 14px 12px;
            border-top: 1.5px solid rgba(0, 255, 255, 0.3);
            display: flex;
            gap: 8px;
            z-index: 50;
            border-radius: 0 0 0 0;
        }

        .nav-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: transparent;
            color: #7777aa;
            font-weight: 700;
            font-size: 11px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            touch-action: manipulation;
            letter-spacing: 0.5px;
        }

        .nav-btn.active {
            background: linear-gradient(145deg, rgba(0, 255, 255, 0.15), rgba(0, 136, 255, 0.1));
            color: #00ffff;
            border: 1.5px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .nav-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 8px currentColor);
        }

        /* ТОСТЫ */
        .status-toast {
            text-align: center;
            color: #00ffff;
            font-size: 14px;
            margin-top: 16px;
            text-shadow: 0 0 20px #00ffff;
            font-weight: 600;
            letter-spacing: 1px;
            min-height: 24px;
        }

        /* КАРТОЧКИ */
        .section-title {
            color: #00ffff;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 18px;
            text-align: center;
            text-shadow: 0 0 25px #00ffff;
            letter-spacing: 2px;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .skin-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            backdrop-filter: blur(15px);
            border-radius: 22px;
            padding: 16px 10px;
            border: 1.5px solid rgba(0, 255, 255, 0.2);
            text-align: center;
            transition: all 0.2s ease;
        }

        .skin-card.owned {
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }

        .skin-card.equipped {
            border-color: #00ffaa;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.4);
            border-width: 2.5px;
        }

        .skin-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px currentColor;
        }

        .skin-letter {
            font-size: 40px;
            font-weight: 900;
        }

        .skin-name {
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .skin-btn {
            background: linear-gradient(145deg, #1a1a3e, #0d0d22);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 16px;
            padding: 10px 12px;
            font-weight: 700;
            font-size: 12px;
            width: 100%;
            cursor: pointer;
            transition: all 0.15s;
        }

        .skin-btn:active {
            transform: scale(0.96);
        }

        .upgrade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .upgrade-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 22px 12px;
            border: 1.5px solid rgba(0, 255, 255, 0.2);
            text-align: center;
        }

        .upgrade-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .upgrade-card h4 {
            color: #ffd700;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .upgrade-btn {
            background: linear-gradient(145deg, #1a1a3e, #0d0d22);
            color: #00ffff;
            border: 1.5px solid rgba(0, 255, 255, 0.4);
            border-radius: 18px;
            padding: 12px 12px;
            font-weight: 700;
            font-size: 13px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        .ton-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 24px;
            border: 1.5px solid rgba(0, 255, 255, 0.25);
        }

        .cyber-input {
            width: 100%;
            background: rgba(10, 10, 20, 0.9);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 18px 18px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .cyber-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .support-card {
            background: linear-gradient(145deg, rgba(20, 20, 45, 0.9), rgba(10, 10, 25, 0.95));
            border-radius: 36px;
            padding: 36px 24px;
            text-align: center;
        }

        .support-username {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(145deg, #00ffff, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="bg-gradient-1"></div>
        <div class="bg-gradient-2"></div>
        <div class="bg-gradient-3"></div>
    </div>
    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="app">
        <div class="page-content">
            <!-- МАЙНИНГ -->
            <div class="page active" id="page-mine">
                <div class="top-panel">
                    <div class="player-card">
                        <div class="player-avatar" id="avatar">H</div>
                        <div class="player-info">
                            <span class="player-name" id="userName">Майнер</span>
                            <div class="player-status">
                                <span class="status-dot"></span>
                                <span>Онлайн</span>
                            </div>
                        </div>
                    </div>
                    <div class="rank-badge" id="rankDisplay">НОВИЧОК</div>
                </div>

                <div class="balance-card">
                    <div class="balance-header">
                        <span class="balance-icon">💎</span>
                        <span class="balance-title">HASKOIN</span>
                        <span class="balance-icon">💎</span>
                    </div>
                    <div class="balance-main">
                        <span class="balance-number" id="balanceDisplay">0.00</span>
                        <span class="balance-currency">HASK</span>
                    </div>
                    <div class="balance-stats">
                        <div class="stat-item">
                            <span class="stat-icon">⚡</span>
                            <span class="stat-value" id="passiveIncome">+0.00</span>
                            <span class="stat-label">/сек</span>
                        </div>
                        <div class="tap-stat">
                            <span id="tapValue">+0.05</span> за тап
                        </div>
                    </div>
                </div>

                <div class="energy-section">
                    <div class="energy-top">
                        <div class="energy-label">
                            <span>🔋</span>
                            <span>ЭНЕРГИЯ</span>
                        </div>
                        <div class="energy-value" id="energyText">500/500</div>
                    </div>
                    <div class="energy-bar-container">
                        <div class="energy-fill" id="energyFill"></div>
                    </div>
                    <div class="energy-footer">
                        <div class="regen-info">
                            <span>🔄</span>
                            <span id="regenInfo">+1 / 5 сек</span>
                        </div>
                        <div class="energy-tip">⚡ -1 за тап</div>
                    </div>
                </div>

                <div class="coin-container">
                    <div class="coin-aura"></div>
                    <div class="coin-3d" id="coin3D">
                        <div class="coin-face" id="coinFace">
                            <div class="coin-shine"></div>
                            <div class="coin-letter" id="coinLetter">H</div>
                            <div class="coin-tap-label">TAP</div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="game-btn purple" id="regenBtn"><span>⚡</span>20 HASK</button>
                    <button class="game-btn gold" id="bonusBtn"><span>🎁</span>БОНУС</button>
                </div>

                <div class="status-toast" id="mineStatus">💎 ТАПАЙ ПО МОНЕТЕ</div>
            </div>

            <!-- ОСТАЛЬНЫЕ СТРАНИЦЫ (скины, прокачка, вывод, поддержка) - структура аналогична -->
            <div class="page" id="page-skins"><div class="section-title">🎨 СКИНЫ</div><div class="skin-grid" id="skinGrid"></div><div class="status-toast" id="skinStatus"></div></div>
            <div class="page" id="page-boost"><div class="section-title">🚀 ПРОКАЧКА</div><div class="upgrade-grid" id="upgradeGrid"></div><div class="status-toast" id="boostStatus"></div></div>
            <div class="page" id="page-wallet"><div class="section-title">💎 ВЫВОД TON</div><div class="ton-card"><div class="rate-box" style="text-align:center;margin-bottom:20px;"><span style="color:#ffd700;font-size:28px;font-weight:800;">3000 HASK = 0.01 TON</span></div><input class="cyber-input" id="tonAddress" placeholder="Адрес TON (EQ... / UQ...)"><input class="cyber-input" id="withdrawAmount" placeholder="Сумма в HASK"><div style="color:#ffd700;margin-bottom:16px;">💰 Вы получите: <span id="tonReceive">0</span> TON</div><button class="game-btn" id="withdrawBtn" style="width:100%;">💎 ОТПРАВИТЬ</button><div id="historyContainer" style="margin-top:20px;"></div></div></div>
            <div class="page" id="page-support"><div class="support-card"><div style="font-size:70px;">🆘</div><h2 style="color:#00ffff;margin:16px 0;">ПОДДЕРЖКА</h2><div class="support-username">@KU1003</div><button class="game-btn" id="openSupportBtn" style="width:100%;">💬 НАПИСАТЬ</button></div></div>
        </div>

        <!-- НИЖНЯЯ ПАНЕЛЬ -->
        <div class="bottom-nav">
            <button class="nav-btn active" data-page="mine"><span class="nav-icon">⛏️</span><span>Майнинг</span></button>
            <button class="nav-btn" data-page="skins"><span class="nav-icon">🎨</span><span>Скины</span></button>
            <button class="nav-btn" data-page="boost"><span class="nav-icon">🚀</span><span>Прокачка</span></button>
            <button class="nav-btn" data-page="wallet"><span class="nav-icon">💎</span><span>Вывод</span></button>
            <button class="nav-btn" data-page="support"><span class="nav-icon">🆘</span><span>Поддержка</span></button>
        </div>
    </div>

    <script>
        // Генерация частиц
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 12 + 's';
            p.style.background = i % 2 === 0 ? '#00ffff' : '#ffd700';
            document.getElementById('particles').appendChild(p);
        }

        (function(){
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            // Данные и логика (сохраняем всю предыдущую механику)
            const SKINS = [
                { id: 'default', name: 'Классик', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #ffe680, #d4a017, #8b6914)', border: '#ffd700', glow: '#ffd700', rarity: 'common', price: 0, owned: true },
                { id: 'neon', name: 'Неон', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #00ffff, #0088ff, #0044aa)', border: '#00ffff', glow: '#00ffff', rarity: 'rare', price: 50 },
                { id: 'gold', name: 'Золотой', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #fff8dc, #ffd700, #b8860b)', border: '#ffd700', glow: '#ffaa00', rarity: 'epic', price: 200 },
                { id: 'ruby', name: 'Рубин', letter: 'H', bg: 'radial-gradient(circle at 30% 35%, #ff6666, #cc0000, #660000)', border: '#ff4444', glow: '#ff0000', rarity: 'epic', price: 250 },
                { id: 'rainbow', name: 'Радужный', letter: 'H', bg: 'linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet)', border: '#ffffff', glow: '#ff00ff', rarity: 'legendary', price: 500 }
            ];

            let balance = 0, maxEnergy = 500, currentEnergy = 500, tapMult = 1, regenMult = 1, autoActive = false;
            let ownedSkins = ['default'], equippedSkin = 'default';
            const userId = tg.initDataUnsafe?.user?.id || 'demo';
            const STORAGE_KEY = `haskoin_ultra_${userId}`;

            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('userName').textContent = user.first_name || 'Майнер';
                document.getElementById('avatar').textContent = user.first_name?.charAt(0) || 'H';
            }

            function fmt(n) { return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

            function saveData() {
                tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify({ balance, maxEnergy, currentEnergy, tapMult, regenMult, autoActive, ownedSkins, equippedSkin }));
            }

            function loadData() {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
                    if (!err && val) {
                        try {
                            const d = JSON.parse(val);
                            balance = d.balance || 0;
                            maxEnergy = d.maxEnergy || 500;
                            currentEnergy = d.currentEnergy ?? maxEnergy;
                            tapMult = d.tapMult || 1;
                            regenMult = d.regenMult || 1;
                            autoActive = d.autoActive || false;
                            ownedSkins = d.ownedSkins || ['default'];
                            equippedSkin = d.equippedSkin || 'default';
                        } catch(e) {}
                    }
                    refreshUI();
                    renderSkins();
                    applySkin(equippedSkin);
                });
            }

            function refreshUI() {
                document.getElementById('balanceDisplay').textContent = fmt(balance);
                const pct = (currentEnergy / maxEnergy) * 100;
                document.getElementById('energyFill').style.width = Math.max(0, pct) + '%';
                document.getElementById('energyText').textContent = `${Math.floor(currentEnergy)}/${maxEnergy}`;
                document.getElementById('tapValue').textContent = `+${(0.05 * tapMult).toFixed(2)}`;
                document.getElementById('regenInfo').textContent = `+${(1 * regenMult).toFixed(1)} / 5 сек`;
                document.getElementById('passiveIncome').textContent = `+${(autoActive ? 0.05 * tapMult : 0).toFixed(2)}`;
                const rank = balance < 1000 ? 'НОВИЧОК' : balance < 10000 ? 'МАЙНЕР' : balance < 50000 ? 'ПРОФИ' : 'ЛЕГЕНДА';
                document.getElementById('rankDisplay').textContent = rank;
            }

            function applySkin(skinId) {
                const skin = SKINS.find(s => s.id === skinId) || SKINS[0];
                equippedSkin = skinId;
                const face = document.getElementById('coinFace');
                const letter = document.getElementById('coinLetter');
                face.style.background = skin.bg;
                face.style.borderColor = skin.border;
                letter.textContent = skin.letter;
                saveData();
            }

            function renderSkins() {
                const grid = document.getElementById('skinGrid');
                grid.innerHTML = SKINS.map(skin => `
                    <div class="skin-card ${ownedSkins.includes(skin.id) ? 'owned' : ''} ${equippedSkin === skin.id ? 'equipped' : ''}">
                        <div class="skin-preview" style="background: ${skin.bg}; border: 2px solid ${skin.border};">
                            <span class="skin-letter" style="background: linear-gradient(145deg, #fff, ${skin.glow}); -webkit-background-clip: text; background-clip: text; color: transparent;">${skin.letter}</span>
                        </div>
                        <div class="skin-name">${skin.name}</div>
                        <button class="skin-btn" data-skin-id="${skin.id}">
                            ${equippedSkin === skin.id ? '✅ Надет' : (ownedSkins.includes(skin.id) ? '👕 Надеть' : `${skin.price} HASK`)}
                        </button>
                    </div>
                `).join('');

                document.querySelectorAll('.skin-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const skinId = btn.dataset.skinId;
                        const skin = SKINS.find(s => s.id === skinId);
                        if (ownedSkins.includes(skinId)) {
                            applySkin(skinId);
                            renderSkins();
                        } else if (balance >= skin.price) {
                            balance -= skin.price;
                            ownedSkins.push(skinId);
                            refreshUI();
                            renderSkins();
                            saveData();
                        }
                    });
                });
            }

            const coin3D = document.getElementById('coin3D');
            
            function tiltCoin(e) {
                const rect = coin3D.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const deltaX = (clientX - centerX) / (rect.width / 2);
                const deltaY = (clientY - centerY) / (rect.height / 2);
                coin3D.style.transform = `rotateX(${-deltaY * 20}deg) rotateY(${deltaX * 20}deg)`;
            }

            function resetTilt() {
                coin3D.style.transform = 'rotateX(0deg) rotateY(0deg)';
            }

            function handleTap(e) {
                if (e) e.preventDefault();
                tiltCoin(e);
                setTimeout(resetTilt, 200);
                
                if (currentEnergy < 1) {
                    document.getElementById('mineStatus').textContent = '❌ НЕТ ЭНЕРГИИ';
                    setTimeout(() => document.getElementById('mineStatus').textContent = '💎 ТАПАЙ ПО МОНЕТЕ', 800);
                    return;
                }
                currentEnergy--;
                let earned = 0.05 * tapMult;
                if (Math.random() < 0.1) earned *= 3;
                balance += earned;
                refreshUI();
                
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;
                const el = document.createElement('div');
                el.className = 'floating-score' + (earned > 0.1 ? ' crit' : '');
                el.textContent = '+' + earned.toFixed(2);
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
                
                document.getElementById('mineStatus').textContent = `+${earned.toFixed(2)} HASK`;
                setTimeout(() => document.getElementById('mineStatus').textContent = '💎 ТАПАЙ ПО МОНЕТЕ', 500);
                saveData();
            }

            coin3D.addEventListener('click', handleTap);
            coin3D.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, { passive: false });
            coin3D.addEventListener('touchmove', (e) => { e.preventDefault(); tiltCoin(e); });
            coin3D.addEventListener('touchend', resetTilt);
            coin3D.addEventListener('mousemove', tiltCoin);
            coin3D.addEventListener('mouseleave', resetTilt);

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
                });
            });

            document.getElementById('regenBtn').addEventListener('click', () => {
                if (balance >= 20) { balance -= 20; currentEnergy = maxEnergy; refreshUI(); saveData(); }
            });

            document.getElementById('bonusBtn').addEventListener('click', () => {
                balance += 5; refreshUI(); saveData();
            });

            document.getElementById('openSupportBtn').addEventListener('click', () => {
                tg.openTelegramLink('https://t.me/KU1003');
            });

            function regen() {
                if (currentEnergy < maxEnergy) {
                    currentEnergy = Math.min(currentEnergy + 1 * regenMult, maxEnergy);
                    refreshUI();
                    saveData();
                }
            }

            loadData();
            setInterval(regen, 5000);
            window.addEventListener('beforeunload', saveData);
        })();
    </script>
</body>
</html>
