<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HASKOIN · Telegram Tapper</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #e2e8f0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            transition: background 0.2s;
        }

        .app-card {
            max-width: 400px;
            width: 100%;
            background: var(--tg-theme-secondary-bg-color, #1e293b);
            border-radius: 36px;
            padding: 24px 18px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,215,0,0.2) inset;
            border: 1px solid rgba(255,215,0,0.15);
            backdrop-filter: blur(4px);
        }

        /* Профиль пользователя */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            background: var(--tg-theme-bg-color, #0f172a);
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid var(--tg-theme-hint-color, #334155);
        }

        .avatar-placeholder {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(145deg, #fbbf24, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #0f172a;
            box-shadow: 0 4px 8px #00000055;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 700;
            font-size: 18px;
            color: var(--tg-theme-text-color, #f1f5f9);
        }

        .user-id-badge {
            font-size: 12px;
            opacity: 0.7;
            color: var(--tg-theme-hint-color, #94a3b8);
        }

        /* Баланс монет */
        .coin-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .coin-icon-large {
            font-size: 38px;
            filter: drop-shadow(0 4px 6px #fbbf24);
        }

        .coin-title {
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(to right, #fcd34d, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .balance-container {
            background: #0b1120cc;
            border-radius: 60px;
            padding: 18px 18px;
            margin: 8px 0 16px;
            border: 1px solid #fbbf2450;
            box-shadow: 0 8px 0 #020617, inset 0 2px 6px #fbbf2430;
            text-align: center;
        }

        .balance-value {
            font-size: 54px;
            font-weight: 900;
            color: #fef9c3;
            text-shadow: 0 3px 0 #b45309, 0 0 20px #fbbf24;
            word-break: break-word;
        }

        .balance-label {
            font-size: 18px;
            color: #fcd34d;
            letter-spacing: 2px;
        }

        /* Энергия */
        .energy-section {
            margin: 18px 0 12px;
        }

        .energy-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .energy-bar-bg {
            height: 22px;
            background: #1e293b;
            border-radius: 30px;
            padding: 2px;
            box-shadow: inset 0 3px 8px #000000;
            border: 1px solid #475569;
        }

        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399, #fbbf24);
            border-radius: 30px;
            box-shadow: 0 0 12px #fbbf24, inset 0 1px 4px white;
            transition: width 0.1s ease;
        }

        .regen-text {
            margin-top: 5px;
            font-size: 14px;
            color: #6ee7b7;
            font-weight: 500;
        }

        /* Монета — ТАП */
        .tap-area {
            display: flex;
            justify-content: center;
            margin: 20px 0 10px;
        }

        .coin-button {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
        }

        .coin-graphic {
            width: 210px;
            height: 210px;
            background: radial-gradient(circle at 30% 30%, #fde68a, #d97706);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 5px #fbbf2480, 0 15px 35px black, inset 0 -6px 8px #92400e, inset 0 6px 14px #fffbeb;
            border: 3px solid #fde68a;
            transition: all 0.15s cubic-bezier(0.2, 0.9, 0.4, 1);
            transform: scale(1);
        }

        .coin-graphic.tap-animation {
            transform: scale(0.86);
            box-shadow: 0 0 0 8px #fcd34d, 0 15px 35px black;
            background: radial-gradient(circle at 30% 30%, #fef3c7, #eab308);
        }

        .coin-letter {
            font-size: 58px;
            font-weight: 900;
            color: #78350f;
            text-shadow: 2px 4px 0 #fde68a;
        }

        .coin-tap-label {
            background: #b4530980;
            backdrop-filter: blur(4px);
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: #fffbeb;
            margin-top: 4px;
        }

        /* Кнопки */
        .action-row {
            display: flex;
            gap: 10px;
            margin: 18px 0 8px;
        }

        .tg-button {
            background: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, white);
            border: none;
            border-radius: 40px;
            padding: 14px 16px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 0 #1e40af, 0 2px 10px black;
            cursor: pointer;
            transition: all 0.08s;
            border-bottom: 2px solid #1e3a8a;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tg-button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1e40af, 0 2px 8px black;
        }

        .save-badge {
            background: #1e293b;
            border-radius: 30px;
            padding: 10px 14px;
            font-size: 13px;
            color: #a5f3fc;
            border: 1px solid #38bdf8;
        }

        .hint {
            text-align: center;
            font-size: 13px;
            opacity: 0.8;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="app-card">
    <!-- Профиль из Telegram -->
    <div class="user-profile">
        <div class="avatar-placeholder" id="userAvatar">👤</div>
        <div class="user-info">
            <div class="user-name" id="userName">Загрузка...</div>
            <div class="user-id-badge" id="userIdBadge">ID: —</div>
        </div>
        <div style="font-size: 20px;">🪙</div>
    </div>

    <!-- HASKOIN баланс -->
    <div class="coin-header">
        <span class="coin-icon-large">🪙</span>
        <span class="coin-title">HASKOIN</span>
        <span class="coin-icon-large">🪙</span>
    </div>
    <div class="balance-container">
        <div class="balance-value" id="balanceDisplay">0</div>
        <div class="balance-label">HASK</div>
    </div>

    <!-- Энергия + реген -->
    <div class="energy-section">
        <div class="energy-header">
            <span>⚡ Энергия</span>
            <span id="energyText">500/500</span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
        <div class="regen-text" id="regenDisplay">🔄 +5/сек · автосохранение</div>
    </div>

    <!-- ТАП МОНЕТА -->
    <div class="tap-area">
        <button class="coin-button" id="tapButton">
            <div class="coin-graphic" id="coinGraphic">
                <div class="coin-letter">H</div>
                <div class="coin-tap-label">TAP</div>
            </div>
        </button>
    </div>

    <!-- Управление -->
    <div class="action-row">
        <button class="tg-button" id="fullRegenButton">
            <span>🔋</span> Восстановить
        </button>
        <button class="tg-button" id="saveForceButton">
            <span>💾</span> Сохранить
        </button>
    </div>
    <div class="save-badge" id="saveStatus">
        ☁️ Данные в облаке Telegram
    </div>
    <div class="hint">
        Нажми на монету — энергия тратится, монеты копятся. Прогресс сохраняется.
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- ИНИЦИАЛИЗАЦИЯ Telegram Web App ----------
        const tg = window.Telegram.WebApp;
        tg.expand();       // на весь экран
        tg.enableClosingConfirmation(); // предупреждение при закрытии

        // Подстраиваем тему
        document.body.style.backgroundColor = tg.backgroundColor || '#0f172a';
        
        // Данные пользователя
        const user = tg.initDataUnsafe?.user;
        const userNameEl = document.getElementById('userName');
        const userAvatarEl = document.getElementById('userAvatar');
        const userIdBadge = document.getElementById('userIdBadge');

        let userId = 'guest';
        if (user) {
            userId = user.id.toString();
            const firstName = user.first_name || '';
            const lastName = user.last_name || '';
            const displayName = firstName || (user.username ? '@'+user.username : 'Hasker');
            userNameEl.textContent = displayName + (lastName ? ' ' + lastName.charAt(0)+'.' : '');
            userIdBadge.textContent = `ID: ${userId}`;
            // первая буква для аватарки
            userAvatarEl.textContent = firstName ? firstName.charAt(0).toUpperCase() : 'H';
        } else {
            userNameEl.textContent = 'HASKOIN Miner';
            userIdBadge.textContent = 'ID: demo';
            userAvatarEl.textContent = 'H';
            console.warn('Запуск вне Telegram или нет данных пользователя');
        }

        // ---------- КОНФИГУРАЦИЯ ----------
        const MAX_ENERGY = 500;
        const TAP_ENERGY_COST = 1;
        const COINS_PER_TAP = 1;
        const REGEN_PER_SEC = 5;
        const SAVE_DEBOUNCE_MS = 800;      // сохранять не чаще раза в 0.8 сек
        const CLOUD_KEY_PREFIX = 'haskoin_';

        // Ключи для облачного хранилища Telegram
        const STORAGE_KEY_BALANCE = CLOUD_KEY_PREFIX + userId + '_balance';
        const STORAGE_KEY_ENERGY = CLOUD_KEY_PREFIX + userId + '_energy';
        const STORAGE_KEY_LAST_UPDATE = CLOUD_KEY_PREFIX + userId + '_lastUpdate';

        // ---------- СОСТОЯНИЕ ----------
        let balance = 0;
        let currentEnergy = MAX_ENERGY;
        
        // UI элементы
        const balanceDisplay = document.getElementById('balanceDisplay');
        const energyText = document.getElementById('energyText');
        const energyFill = document.getElementById('energyFill');
        const coinGraphic = document.getElementById('coinGraphic');
        const tapButton = document.getElementById('tapButton');
        const fullRegenBtn = document.getElementById('fullRegenButton');
        const saveForceBtn = document.getElementById('saveForceButton');
        const saveStatus = document.getElementById('saveStatus');

        let tapAnimTimer = null;
        let pendingSaveTimer = null;
        let lastSavedBalance = 0;
        let lastSavedEnergy = MAX_ENERGY;

        // ---------- ОБНОВЛЕНИЕ UI ----------
        function refreshUI() {
            balanceDisplay.textContent = balance.toLocaleString();
            const percent = Math.max(0, (currentEnergy / MAX_ENERGY) * 100);
            energyFill.style.width = percent + '%';
            energyText.textContent = `${Math.floor(currentEnergy)}/${MAX_ENERGY}`;
        }

        // ---------- АНИМАЦИЯ ТАПА ----------
        function playTapFeedback(success = true) {
            if (tapAnimTimer) clearTimeout(tapAnimTimer);
            coinGraphic.classList.add('tap-animation');
            tapAnimTimer = setTimeout(() => {
                coinGraphic.classList.remove('tap-animation');
                tapAnimTimer = null;
            }, 130);
            
            if (!success) {
                coinGraphic.style.transition = 'transform 0.1s';
                coinGraphic.style.transform = 'translateX(4px)';
                setTimeout(() => coinGraphic.style.transform = 'translateX(-4px)', 40);
                setTimeout(() => coinGraphic.style.transform = 'translateX(2px)', 80);
                setTimeout(() => { 
                    coinGraphic.style.transform = ''; 
                    coinGraphic.style.transition = '';
                }, 130);
            }
        }

        // ---------- ЛОГИКА ТАПА ----------
        function performTap() {
            if (currentEnergy >= TAP_ENERGY_COST) {
                currentEnergy -= TAP_ENERGY_COST;
                balance += COINS_PER_TAP;
                playTapFeedback(true);
                refreshUI();
                scheduleSave();
            } else {
                playTapFeedback(false);
                // Визуально подсветить нехватку
                energyFill.style.transition = 'box-shadow 0.15s';
                energyFill.style.boxShadow = '0 0 20px #ef4444';
                setTimeout(() => {
                    energyFill.style.boxShadow = '0 0 12px #fbbf24, inset 0 1px 4px white';
                    energyFill.style.transition = '';
                }, 200);
            }
        }

        // ---------- РЕГЕНЕРАЦИЯ ----------
        function applyRegen() {
            if (currentEnergy < MAX_ENERGY) {
                currentEnergy = Math.min(currentEnergy + 1, MAX_ENERGY); // +1 каждый вызов (каждые 200мс = 5/сек)
                refreshUI();
                scheduleSave();
            }
        }

        // ---------- СОХРАНЕНИЕ В ОБЛАКО TELEGRAM ----------
        function saveToCloud() {
            if (!tg.isVersionAtLeast('6.9')) {
                saveStatus.textContent = '⚠️ Облако не поддерживается';
                return;
            }

            const cloudData = {
                balance: balance,
                energy: currentEnergy,
                lastUpdate: Date.now()
            };

            // Сохраняем в CloudStorage Telegram
            tg.CloudStorage.setItem(STORAGE_KEY_BALANCE, String(balance), (err, success) => {
                if (err) console.warn('Ошибка сохранения баланса', err);
            });
            tg.CloudStorage.setItem(STORAGE_KEY_ENERGY, String(currentEnergy), (err, success) => {});
            tg.CloudStorage.setItem(STORAGE_KEY_LAST_UPDATE, String(Date.now()), (err, success) => {
                if (!err) {
                    lastSavedBalance = balance;
                    lastSavedEnergy = currentEnergy;
                    saveStatus.innerHTML = '☁️ Сохранено в облаке Telegram';
                    setTimeout(() => {
                        if (saveStatus) saveStatus.innerHTML = '☁️ Данные в облаке Telegram';
                    }, 1500);
                } else {
                    saveStatus.innerHTML = '⚠️ Ошибка синхронизации';
                }
            });
        }

        function scheduleSave() {
            if (pendingSaveTimer) clearTimeout(pendingSaveTimer);
            pendingSaveTimer = setTimeout(() => {
                // Не сохраняем слишком часто без изменений
                if (balance !== lastSavedBalance || Math.abs(currentEnergy - lastSavedEnergy) > 0.5) {
                    saveToCloud();
                }
                pendingSaveTimer = null;
            }, SAVE_DEBOUNCE_MS);
        }

        // Загрузка данных из облака при старте
        function loadFromCloud() {
            if (!tg.isVersionAtLeast('6.9')) {
                saveStatus.textContent = '☁️ Облако недоступно (используйте Telegram)';
                balance = 0;
                currentEnergy = MAX_ENERGY;
                refreshUI();
                return;
            }

            tg.CloudStorage.getItems([STORAGE_KEY_BALANCE, STORAGE_KEY_ENERGY, STORAGE_KEY_LAST_UPDATE], (err, values) => {
                if (err) {
                    console.warn('Ошибка загрузки', err);
                    balance = 0;
                    currentEnergy = MAX_ENERGY;
                } else {
                    const savedBalance = values[STORAGE_KEY_BALANCE];
                    const savedEnergy = values[STORAGE_KEY_ENERGY];
                    const lastUpdateStr = values[STORAGE_KEY_LAST_UPDATE];

                    if (savedBalance !== undefined) {
                        balance = parseInt(savedBalance, 10) || 0;
                    } else {
                        balance = 0;
                    }

                    if (savedEnergy !== undefined) {
                        currentEnergy = parseFloat(savedEnergy) || MAX_ENERGY;
                    } else {
                        currentEnergy = MAX_ENERGY;
                    }

                    // Офлайн-регенерация (если прошло время)
                    if (lastUpdateStr) {
                        const lastUpdate = parseInt(lastUpdateStr, 10);
                        if (!isNaN(lastUpdate)) {
                            const now = Date.now();
                            const secondsPassed = (now - lastUpdate) / 1000;
                            if (secondsPassed > 0 && currentEnergy < MAX_ENERGY) {
                                const regenAmount = secondsPassed * REGEN_PER_SEC;
                                currentEnergy = Math.min(currentEnergy + regenAmount, MAX_ENERGY);
                            }
                        }
                    }

                    lastSavedBalance = balance;
                    lastSavedEnergy = currentEnergy;
                }
                refreshUI();
                saveStatus.innerHTML = '☁️ Данные загружены';
                setTimeout(() => saveStatus.innerHTML = '☁️ Данные в облаке Telegram', 1200);
            });
        }

        // Полное восстановление
        function fullRegen() {
            currentEnergy = MAX_ENERGY;
            refreshUI();
            scheduleSave();
            coinGraphic.style.transform = 'scale(1.05)';
            setTimeout(() => coinGraphic.style.transform = '', 150);
            saveStatus.innerHTML = '🔋 Энергия восстановлена';
        }

        // Принудительное сохранение
        function forceSave() {
            saveToCloud();
            saveStatus.innerHTML = '💾 Сохраняю...';
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            loadFromCloud();
            
            // Регенерация каждые 200 мс (5 в сек)
            setInterval(() => {
                applyRegen();
            }, 200);

            // Обработчики
            tapButton.addEventListener('click', (e) => {
                e.preventDefault();
                performTap();
            });

            tapButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
            }, { passive: false });

            fullRegenBtn.addEventListener('click', (e) => {
                fullRegen();
            });

            saveForceBtn.addEventListener('click', (e) => {
                forceSave();
            });

            // Готовность приложения
            tg.ready();
            tg.MainButton?.hide();
            
            // Автосохранение перед закрытием
            window.addEventListener('beforeunload', () => {
                if (pendingSaveTimer) {
                    clearTimeout(pendingSaveTimer);
                    saveToCloud();
                }
            });
        }

        init();
    })();
</script>
</body>
</html>
